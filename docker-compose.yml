services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airport_guide_backend
    network_mode: host
    environment:
      - APP_ENV=production
      - ROBOT_ADAPTER_MODE=ros
      - ROS_DOMAIN_ID=0
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - SECRET_KEY=change_this_to_a_secure_random_key_in_production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airport_guide_frontend
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped
